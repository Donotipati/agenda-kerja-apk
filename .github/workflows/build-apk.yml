name: Build Agenda Kerja APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
        

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: |
          npm install @capacitor/cli@7.4.3
          npm install @capacitor/core@7.4.3
          npm install @capacitor/android@7.4.3
          npm install @capacitor/local-notifications@7.0.3
          
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "id.agendakerja.app",
            "appName": "Agenda Kerja",
            "webDir": "www"
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Capacitor Android files
        run: |
          test -f android/capacitor.settings.gradle
          test -f android/capacitor.build.gradle
          echo "Capacitor Android files OK"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agenda-kerja-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
