name: Build Agenda Kerja APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm install
          npm install @capacitor/cli@7.4.3 @capacitor/core@7.4.3 @capacitor/android@7.4.3 @capacitor/local-notifications@7.0.3

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/index.html
          cp manifest.json www/manifest.json
          cp sw.js www/sw.js
          cp native-notifications.js www/native-notifications.js

          if [ -d icons ]; then
            cp -r icons www/icons
          fi

          echo "=== WWW CONTENT ==="
          find www -maxdepth 2 -type f -print

          test -f www/index.html

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "id.agendakerja.app",
            "appName": "Agenda Kerja",
            "webDir": "www"
          }
          EOF

          cat capacitor.config.json

      - name: Add Android
        run: npx cap add android

      - name: Install Capacitor Assets tool
        run: npm install @capacitor/assets@3.0.5 --save-dev

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Kerja-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
